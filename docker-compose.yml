services:
  db:
    image: postgres:16-alpine
    container_name: ema-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ema
      POSTGRES_PASSWORD: ema
      POSTGRES_DB: event_management
    ports:
      - "5432:5432"
    volumes:
      - ema_pgdata:/var/lib/postgresql/data

volumes:
  ema_pgdata:
